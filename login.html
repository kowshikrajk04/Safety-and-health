<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SafePulse AI</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 0%, rgba(10,102,255,0.2) 0%, transparent 65%),
                  var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(12px);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo .brand {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }
    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.75rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.55rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .auth-tab.active {
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #fff;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 1.25rem 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="brand">🛡️ SafePulse AI</div>
      <p>Your AI-powered safety &amp; wellness companion</p>
    </div>

    <!-- TABS -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="tabLogin" role="tab" aria-selected="true" aria-controls="formLogin">Sign In</button>
      <button class="auth-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="formSignup">Sign Up</button>
    </div>

    <div id="authAlert"></div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="formLogin" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email</label>
        <input class="form-control" id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" />
        <div class="form-error" id="loginEmailError">Please enter a valid email.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-control" id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
        <div class="form-error" id="loginPasswordError">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;">
        Sign In
      </button>
      <div class="divider">or</div>
      <p style="text-align:center;color:var(--muted);font-size:0.85rem;">
        Don't have an account?
        <button type="button" id="switchToSignup" style="background:none;border:none;color:var(--cyan);cursor:pointer;font-size:0.85rem;font-weight:600;">Sign Up</button>
      </p>
    </form>

    <!-- SIGNUP FORM -->
    <form class="auth-form" id="formSignup" novalidate>
      <div class="form-group">
        <label class="form-label" for="signupUsername">Username</label>
        <input class="form-control" id="signupUsername" type="text" placeholder="johndoe" autocomplete="username" />
        <div class="form-error" id="signupUsernameError">Username is required.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signupEmail">Email</label>
        <input class="form-control" id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email" />
        <div class="form-error" id="signupEmailError">Please enter a valid email.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signupPassword">Password</label>
        <input class="form-control" id="signupPassword" type="password" placeholder="Min. 6 characters" autocomplete="new-password" />
        <div class="form-error" id="signupPasswordError">Password must be at least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;">
        Create Account
      </button>
      <div class="divider">or</div>
      <p style="text-align:center;color:var(--muted);font-size:0.85rem;">
        Already have an account?
        <button type="button" id="switchToLogin" style="background:none;border:none;color:var(--cyan);cursor:pointer;font-size:0.85rem;font-weight:600;">Sign In</button>
      </p>
    </form>

  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
